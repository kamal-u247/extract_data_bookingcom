<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Out of Stock Lodge</title>
</head>
<body>
  <h2 class="hp__hotel-name">Out of Stock Lodge</h2>
  <div id="property_description_content">A quiet retreat with currently no available rooms.</div>

  <!-- Availability Table with sold out / unpriced rooms -->
  <table class="hprt-table">
    <thead>
      <tr>
        <th>Room Type</th>
        <th>Occupancy</th>
        <th>Price</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="hprt-table-cell-roomtype">
          <a class="hprt-roomtype-link" href="#">Standard Queen Room</a>
        </td>
        <td class="hprt-table-cell-occupancy">Max occupancy: 2</td>
        <td class="hprt-table-cell-price">
          <span class="sold-out-badge">Sold Out</span>
        </td>
      </tr>
      <tr>
        <td class="hprt-table-cell-roomtype">
          <a class="hprt-roomtype-link" href="#">Executive Suite</a>
        </td>
        <td class="hprt-table-cell-occupancy">Max occupancy: 3</td>
        <td class="hprt-table-cell-price">
          <span>Rates unavailable for selected dates</span>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
